---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: vpcassociationpolicies.application-networking.k8s.aws
spec:
  group: application-networking.k8s.aws
  names:
    categories:
    - gateway-api
    kind: VpcAssociationPolicy
    listKind: VpcAssociationPolicyList
    plural: vpcassociationpolicies
    shortNames:
    - vap
    singular: vpcassociationpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.privateDnsEnabled
      name: PrivateDNS
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VpcAssociationPolicySpec defines the desired state of VpcAssociationPolicy.
            properties:
              associateWithVpc:
                description: |-
                  AssociateWithVpc indicates whether the VpcServiceNetworkAssociation should be created for the current VPC of k8s cluster.

                  This value will be considered true by default.
                type: boolean
              dnsOptions:
                description: |-
                  DnsOptions selects which custom domain names get private DNS in the cluster VPC.
                  It can only be set when PrivateDnsEnabled is true and, like PrivateDnsEnabled, is only applied
                  when the VpcServiceNetworkAssociation is created.
                properties:
                  privateDnsPreference:
                    description: |-
                      PrivateDnsPreference selects which custom domain names get private DNS in the cluster VPC.

                      When unset, VPC Lattice applies its default, VERIFIED_DOMAINS_ONLY, which is also the value AWS
                      recommends, and the controller does not compare the preference of an existing association.
                    enum:
                    - VERIFIED_DOMAINS_ONLY
                    - ALL_DOMAINS
                    - VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS
                    - SPECIFIED_DOMAINS_ONLY
                    type: string
                  privateDnsSpecifiedDomains:
                    description: |-
                      PrivateDnsSpecifiedDomains lists custom domain names that get private DNS in addition to
                      (VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS) or instead of (SPECIFIED_DOMAINS_ONLY) the verified domains.
                      Wildcard names such as "*.example.com" are allowed.

                      It is required for those two preferences and must not be set for the others.
                    items:
                      description: |-
                        PrivateDnsDomain is a domain name that VPC Lattice resolves privately in the cluster VPC.
                        Wildcards such as *.example.com are allowed; the syntax is validated by VPC Lattice.
                      maxLength: 255
                      minLength: 1
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - fieldPath: .privateDnsSpecifiedDomains
                  message: privateDnsSpecifiedDomains can only be set when privateDnsPreference
                    is VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS or SPECIFIED_DOMAINS_ONLY
                  rule: '!has(self.privateDnsSpecifiedDomains) || (has(self.privateDnsPreference)
                    && self.privateDnsPreference in [''VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS'',
                    ''SPECIFIED_DOMAINS_ONLY''])'
                - fieldPath: .privateDnsSpecifiedDomains
                  message: privateDnsSpecifiedDomains is required when privateDnsPreference
                    is VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS or SPECIFIED_DOMAINS_ONLY
                  rule: '!(has(self.privateDnsPreference) && self.privateDnsPreference
                    in [''VERIFIED_DOMAINS_AND_SPECIFIED_DOMAINS'', ''SPECIFIED_DOMAINS_ONLY''])
                    || has(self.privateDnsSpecifiedDomains)'
              privateDnsEnabled:
                description: |-
                  PrivateDnsEnabled enables private DNS on the VpcServiceNetworkAssociation: VPC Lattice then
                  provisions private hosted zones in the cluster VPC for the custom domain names of resource
                  configurations associated with the service network, as selected by DnsOptions. The service
                  network owner must also enable private DNS on the resource association.

                  When unset, the association is created with private DNS disabled (the VPC Lattice default)
                  and the setting is not compared on an existing association.

                  VPC Lattice only accepts this setting when the association is created. If an existing
                  association differs, the controller keeps it and reports the "Programmed" condition with
                  reason "PrivateDnsMismatch"; set AssociateWithVpc to false and back to true to recreate it.

                  For more details, please check the VPC Lattice documentation https://docs.aws.amazon.com/vpc-lattice/latest/ug/resource-configuration.html#custom-domain-name-resource-consumers
                type: boolean
              securityGroupIds:
                description: |-
                  SecurityGroupIds defines the security groups enforced on the VpcServiceNetworkAssociation.
                  Security groups does not take effect if AssociateWithVpc is set to false.

                  For more details, please check the VPC Lattice documentation https://docs.aws.amazon.com/vpc-lattice/latest/ug/security-groups.html
                items:
                  maxLength: 32
                  minLength: 3
                  pattern: ^sg-[0-9a-z]+$
                  type: string
                minItems: 1
                type: array
              targetRef:
                description: |-
                  TargetRef points to the kubernetes Gateway resource that will have this policy attached.

                  This field is following the guidelines of Kubernetes Gateway API policy attachment.
                properties:
                  group:
                    description: Group is the group of the target resource.
                    maxLength: 253
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  kind:
                    description: Kind is kind of the target resource.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referent. When unspecified, the local
                      namespace is inferred. Even when policy targets a resource in a different
                      namespace, it MUST only apply to traffic originating from the same
                      namespace as the policy.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
            x-kubernetes-validations:
            - fieldPath: .dnsOptions
              message: dnsOptions can only be set when privateDnsEnabled is true
              rule: '!has(self.dnsOptions) || (has(self.privateDnsEnabled) && self.privateDnsEnabled)'
          status:
            description: VpcAssociationPolicyStatus defines the observed state of
              VpcAssociationPolicy.
            properties:
              conditions:
                default:
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: Accepted
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: Programmed
                description: |-
                  Conditions describe the current conditions of the VpcAssociationPolicy.

                  Implementations should prefer to express Policy conditions
                  using the `PolicyConditionType` and `PolicyConditionReason`
                  constants so that operators and tools can converge on a common
                  vocabulary to describe VpcAssociationPolicy state.

                  Known condition types are:

                  * "Accepted"
                  * "Programmed"
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
